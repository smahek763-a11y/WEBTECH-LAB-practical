<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DOM Manipulation Project</title>

<style>
/* ============ GLOBAL ============ */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
}

/* ============ CARD ============ */
.card {
  width: 420px;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(12px);
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.4);
}

/* ============ HEADER ============ */
.card h2 {
  text-align: center;
  margin-bottom: 8px;
}

.card p {
  text-align: center;
  font-size: 14px;
  opacity: 0.9;
  margin-bottom: 18px;
}

/* ============ BUTTONS ============ */
.controls {
  text-align: center;
  margin-bottom: 15px;
}

button {
  background: linear-gradient(135deg, #ff9966, #ff5e62);
  border: none;
  color: white;
  padding: 8px 14px;
  border-radius: 20px;
  margin: 4px;
  cursor: pointer;
  font-size: 13px;
  transition: 0.3s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 15px rgba(0,0,0,0.3);
}

/* ============ LIST ============ */
ul {
  list-style: none;
  margin-top: 10px;
}

li {
  background: rgba(255,255,255,0.2);
  margin: 6px 0;
  padding: 10px 12px;
  border-radius: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

li span {
  font-size: 14px;
}

.removeBtn {
  background: #ff4d4d;
  border: none;
  color: white;
  border-radius: 50%;
  width: 26px;
  height: 26px;
  cursor: pointer;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="card">
  <h2>DOM Manipulation</h2>
  <p>Create • Append • Modify • Remove</p>

  <div class="controls">
    <button onclick="addItem()">Add Item</button>
    <button onclick="modifyItem()">Modify Last</button>
    <button onclick="removeItem()">Remove Last</button>
  </div>

  <ul id="list">
    <li><span>Sample Item</span></li>
  </ul>
</div>

<script>
const list = document.getElementById("list");
let count = 1;

/* ===== CREATE & APPEND ===== */
function addItem() {
  const li = document.createElement("li");      // create element
  const span = document.createElement("span");  // child element
  span.textContent = "New Item " + count++;     // modify content

  const btn = document.createElement("button");
  btn.textContent = "×";
  btn.className = "removeBtn";

  btn.addEventListener("click", () => {
    li.remove(); // remove child node
  });

  li.appendChild(span); // append child
  li.appendChild(btn);
  list.appendChild(li);
}

/* ===== MODIFY CHILD ===== */
function modifyItem() {
  const lastItem = list.lastElementChild;
  if (lastItem) {
    lastItem.querySelector("span").textContent += " (Modified)";
  }
}

/* ===== REMOVE CHILD ===== */
function removeItem() {
  const lastItem = list.lastElementChild;
  if (lastItem) {
    list.removeChild(lastItem);
  }
}
</script>

</body>
</html>
