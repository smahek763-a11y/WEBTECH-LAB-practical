<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Toggle Project</title>

<style>
/* ================= GLOBAL ================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #1d2671, #c33764);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ================= GLASS CARD ================= */
.container {
  width: 360px;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 25px;
  color: #fff;
  box-shadow: 0 20px 40px rgba(0,0,0,0.35);
  text-align: center;
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

h1 {
  font-size: 22px;
  margin-bottom: 8px;
}

.subtitle {
  font-size: 14px;
  opacity: 0.9;
  margin-bottom: 20px;
}

/* ================= BUTTON ================= */
button {
  background: linear-gradient(135deg, #ff512f, #dd2476);
  border: none;
  color: white;
  padding: 12px 24px;
  font-size: 15px;
  border-radius: 30px;
  cursor: pointer;
  transition: all 0.3s ease;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

/* ================= CONTENT BOX ================= */
.content {
  margin-top: 25px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 15px;
  padding: 18px;
  text-align: left;
  line-height: 1.6;
  transition: all 0.5s ease;
}

/* ================= TOGGLE CLASS ================= */
.hide {
  opacity: 0;
  transform: translateY(-30px);
  max-height: 0;
  overflow: hidden;
  padding: 0 18px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Interactive Web Project</h1>
  <p class="subtitle">Show / Hide using JavaScript</p>

  <button id="toggleBtn">Show Project Details</button>

  <div id="contentBox" class="content hide">
    <strong>Project Highlights:</strong><br>
    ✔ Clean HTML Structure<br>
    ✔ CSS Glassmorphism UI<br>
    ✔ Smooth Animations<br>
    ✔ JavaScript DOM Handling<br>
    ✔ classList.toggle() Usage
  </div>
</div>

<script>
const btn = document.getElementById("toggleBtn");
const box = document.getElementById("contentBox");

btn.addEventListener("click", () => {
  box.classList.toggle("hide");

  btn.textContent = box.classList.contains("hide")
    ? "Show Project Details"
    : "Hide Project Details";
});
</script>

</body>
</html>
