<!DOCTYPE html>
<html>
<head>

<style>`````34E44

body {
    margin: 0;
    padding: 40px;
    background: #eef4e8;
    font-family: 'Poppins', sans-serif;
}

/* MAIN CARD */
.profile-card {
    width: 340px;
    background: #ffffff;
    margin: auto;
    border-radius: 25px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    overflow: hidden;
    transition: 0.3s;
}

.profile-card:hover {
    transform: translateY(-5px);
}

/* TOP SECTION LIKE YOUR IMAGE */
.top-section {
    background: #cf7282;
    height: 160px;
    border-bottom-left-radius: 40px;
    border-bottom-right-radius: 40px;
    position: relative;
}

/* PROFILE PHOTO */
.profile-photo {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 6px solid white;
    position: absolute;
    left: 50%;
    bottom: -60px;
    transform: translateX(-50%);
}

/* CONTENT */
.content {
    padding: 80px 25px 25px;
    text-align: center;
}

/* NAME */
.content h2 {
    margin: 0;
    font-weight: 600;
    font-size: 22px;
}

/* DESIGNATION */
.content h4 {
    margin: 5px 0 15px;
    font-weight: 400;
    color: #444;
}

/* DIVIDERS */
.divider {
    width: 80%;
    margin: 15px auto;
    height: 1px;
    background: #ccc;
}

/* ABOUT TEXT */
.about {
    font-size: 14px;
    color: #555;
    line-height: 1.6;
    padding: 0 5px;
}

/* SOCIAL SECTION */
.social {
    margin-top: 15px;
    text-align: left;
    padding: 0 20px 20px;
}

.social-row {
    display: flex;
    align-items: center;
    margin: 8px 0;
}

.social-row span {
    font-size: 22px;
    margin-right: 10px;
}

.social-row p {
    margin: 0;
    font-size: 14px;
}

/* Hover effect */
.social-row:hover {
    transform: translateX(5px);
    transition: 0.3s;
}

</style>
</head>

<body>

<div class="profile-card">

    <div class="top-section">
        <img src="https://via.placeholder.com/120" class="profile-photo">
    </div>

    <div class="content">
        <h2>Matt Adetola</h2>
        <h4>Product Designer</h4>

        <div class="divider"></div>

        <p class="about">
            I joined this platform to increase my knowledge about UI/UX design.
            I also love to learn from friends and organizers in this space.
        </p>

        <div class="divider"></div>
    </div>

    <div class="social">
        <div class="social-row">
            <span>🐦</span>
            <p>Lency1013</p>
        </div>

        <div class="social-row">
            <span>💼</span>
            <p>kayode Emmanuel</p>
        </div>
    </div>

</div>

</body>
</html>
