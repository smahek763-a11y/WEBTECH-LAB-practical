<!DOCTYPE html>
<html>
<head>
    <title>Pastel Calculator</title>
    <style>
        body {
            background: linear-gradient(to right, #e6e9f0, #eef1f5); /* soft grey-blue */
            font-family: "Trebuchet MS", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: #ffffff;
            padding: 25px;
            width: 300px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 4px 20px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 15px;
            color: #6c7a89; /* subtle grey */
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 2px solid #d6dde6; /* soft border */
            background: #f7f9fc; /* light pastel background */
        }

        .btn {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background-color: #a3b9cc; /* pastel blue-grey */
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #8fa6bc; /* slightly darker hover */
        }

        #result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #4b6584; /* calm navy-grey */
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Simple Calculator 💡</h2>

    <input type="number" id="n1" placeholder="Enter first number">
    <input type="number" id="n2" placeholder="Enter second number">

    <br>

    <button class="btn" onclick="calc('+')">+</button>
    <button class="btn" onclick="calc('-')">-</button>
    <button class="btn" onclick="calc('*')">×</button>
    <button class="btn" onclick="calc('/')">÷</button>

    <p id="result">Result: —</p>
</div>

<script>
    function calc(op) {
        let a = parseFloat(document.getElementById("n1").value);
        let b = parseFloat(document.getElementById("n2").value);
        let r;

        if (op === '+') r = a + b;
        if (op === '-') r = a - b;
        if (op === '*') r = a * b;
        if (op === '/') {
            if (b === 0) {
                document.getElementById("result").innerHTML = "Result: ❌ Can't divide by 0";
                return;
            }
            r = a / b;
        }

        document.getElementById("result").innerHTML = "Result: " + r;
    }
</script>

</body>
</html>
